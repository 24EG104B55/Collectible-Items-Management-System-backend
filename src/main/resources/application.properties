server.port=${PORT:8080}

# Spring Application Name
spring.application.name=collectible-items-management-system

# ==============================================================
# Database Configuration: MySQL
# ==============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/collectibles_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root@123

# JPA / Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console disabled (using MySQL)
spring.h2.console.enabled=false

# Logging
logging.level.com.raretrack=INFO
